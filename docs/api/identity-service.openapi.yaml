openapi: 3.1.0

info:
  title: OVSA Identity Service API
  version: 1.0.0
  description: >
    API responsable de organizaciones, usuarios, trabajadores,
    roles y permisos empresariales.

servers:
  - url: http://localhost:8080
    description: API Gateway local

security:
  - bearerAuth: []

tags:
  - name: Organizations
  - name: Employees

paths:
  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: Listar organizaciones
      operationId: listOrganizations
      parameters:
        - $ref: './common-components.yaml#/components/parameters/Page'
        - $ref: './common-components.yaml#/components/parameters/Size'
        - $ref: './common-components.yaml#/components/parameters/Sort'
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de organizaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: './common-components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common-components.yaml#/components/responses/InternalServerError'

    post:
      tags: [Organizations]
      summary: Crear una organización
      operationId: createOrganization
      parameters:
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organización creada.
          headers:
            Location:
              description: Ruta del recurso creado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: './common-components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common-components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common-components.yaml#/components/responses/Conflict'
        '422':
          $ref: './common-components.yaml#/components/responses/UnprocessableContent'

  /api/v1/organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Consultar una organización
      operationId: getOrganizationById
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Organización encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: './common-components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yaml#/components/responses/NotFound'

    patch:
      tags: [Organizations]
      summary: Actualizar parcialmente una organización
      operationId: updateOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organización actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: './common-components.yaml#/components/responses/BadRequest'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yaml#/components/responses/NotFound'
        '409':
          $ref: './common-components.yaml#/components/responses/Conflict'
        '422':
          $ref: './common-components.yaml#/components/responses/UnprocessableContent'

  /api/v1/employees:
    get:
      tags: [Employees]
      summary: Listar trabajadores
      operationId: listEmployees
      parameters:
        - $ref: './common-components.yaml#/components/parameters/Page'
        - $ref: './common-components.yaml#/components/parameters/Size'
        - $ref: './common-components.yaml#/components/parameters/Sort'
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmployeeStatus'
      responses:
        '200':
          description: Página de trabajadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
        '401':
          $ref: './common-components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'

    post:
      tags: [Employees]
      summary: Registrar un trabajador
      operationId: createEmployee
      parameters:
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Trabajador registrado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          $ref: './common-components.yaml#/components/responses/BadRequest'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common-components.yaml#/components/responses/Conflict'
        '422':
          $ref: './common-components.yaml#/components/responses/UnprocessableContent'

  /api/v1/employees/{employeeId}:
    get:
      tags: [Employees]
      summary: Consultar un trabajador
      operationId: getEmployeeById
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: './common-components.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Trabajador encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '403':
          $ref: './common-components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      $ref: './common-components.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    OrganizationStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - businessName
        - taxIdentifier
        - email
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 150
          example: OVSA Servicios SpA
        tradeName:
          type: string
          maxLength: 150
          example: OVSA
        taxIdentifier:
          type: string
          minLength: 3
          maxLength: 30
          example: 76.123.456-7
        email:
          type: string
          format: email
          example: contacto@ovsa.cl
        phone:
          type: string
          maxLength: 30

    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 150
        tradeName:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        version:
          type: integer
          format: int64
          minimum: 0

    OrganizationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - businessName
        - taxIdentifier
        - email
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        businessName:
          type: string
        tradeName:
          type: string
        taxIdentifier:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    OrganizationPage:
      type: object
      additionalProperties: false
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationResponse'
        page:
          $ref: './common-components.yaml#/components/schemas/PageMetadata'

    EmployeeStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required:
        - employeeCode
        - firstName
        - lastName
        - email
      properties:
        employeeCode:
          type: string
          minLength: 1
          maxLength: 30
          example: EMP-0001
        firstName:
          type: string
          minLength: 2
          maxLength: 80
        lastName:
          type: string
          minLength: 2
          maxLength: 80
        documentNumber:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        position:
          type: string
          maxLength: 100
        branchId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid

    EmployeeResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - employeeCode
        - firstName
        - lastName
        - email
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        documentNumber:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        position:
          type: string
        branchId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    EmployeePage:
      type: object
      additionalProperties: false
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        page:
          $ref: './common-components.yaml#/components/schemas/PageMetadata'